name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true
  - type: dropdown
    id: extension-point
    attributes:
      label: Does this fit an existing extension point?
      description: See docs/ — many additions are small, well-scoped changes.
      options:
        - "No / not sure"
        - "New layer type"
        - "New dataset format"
        - "New pretrained model"
        - "New example network"
        - "New workspace/tab"
        - "Something else"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
